<form method="post" action="/nuevo/descripcion"
      hx-post="/nuevo/descripcion" hx-target="#paso" hx-swap="innerHTML"
      hx-disabled-elt="find button"
      class="space-y-8">
  <input type="hidden" name="title" value="{{ title }}">

  <div class="space-y-3">
    <p class="text-sm text-stone-400 dark:text-slate-500">{{ title }}</p>
    <h1 class="text-3xl font-light tracking-tight sm:text-4xl">Denos algún detalle más</h1>
    <p class="text-stone-500 dark:text-slate-400">Describa el problema o la petición con el detalle que pueda.</p>
  </div>

  <div class="space-y-2">
    <label for="description" class="block text-sm font-medium text-stone-600 dark:text-slate-300">Descripción</label>
    <textarea id="description" name="description" rows="6" maxlength="5000" autofocus required
              placeholder="Qué ha pasado, desde cuándo, a quién afecta…"
              class="w-full resize-y rounded-lg border border-stone-300 bg-white px-4 py-3 text-base
                     placeholder:text-stone-300 focus:border-stone-900 focus:ring-0 focus:outline-none
                     dark:border-slate-700 dark:bg-slate-900 dark:placeholder:text-slate-600 dark:focus:border-slate-100">{{ description }}</textarea>
    {% if error %}
      <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ error }}</p>
    {% endif %}
  </div>

  <button type="submit"
          class="rounded-full bg-stone-900 px-8 py-3 text-sm font-medium text-white
                 transition hover:bg-stone-700 disabled:cursor-wait disabled:opacity-60
                 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-300">
    <span class="idle-label">Aceptar</span>
    <span class="htmx-indicator">Enviando…</span>
  </button>
</form>
