<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriageBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl p-6">
    <h1 class="text-3xl font-bold">TriageBot</h1>
    <p class="mt-2 text-slate-600">Tablero de incidencias con clasificación automática por IA.</p>

    <section class="mt-6 rounded-lg bg-white p-4 shadow-sm ring-1 ring-slate-200">
      <h2 class="text-lg font-semibold">Nuevo ticket</h2>
      <form id="create-form"
            class="mt-3 grid gap-3"
            hx-post="/ui/tickets"
            hx-include="#filters"
            hx-target="#tickets-table"
            hx-swap="innerHTML"
            hx-on::after-request="if (event.detail.successful) this.reset()">
        <label class="grid gap-1 text-sm font-medium">
          Título
          <input type="text" name="title" maxlength="200" required
                 class="rounded border border-slate-300 px-3 py-2 font-normal">
        </label>
        <label class="grid gap-1 text-sm font-medium">
          Descripción
          <textarea name="description" rows="3" maxlength="5000" required
                    class="rounded border border-slate-300 px-3 py-2 font-normal"></textarea>
        </label>
        <div>
          <button type="submit"
                  class="rounded bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700">
            Crear y clasificar
          </button>
          <span class="htmx-indicator ml-2 text-sm text-slate-500">Clasificando…</span>
        </div>
      </form>
    </section>

    <form id="filters"
          class="mt-6 flex flex-wrap items-end gap-3"
          hx-get="/ui/tickets"
          hx-trigger="change"
          hx-target="#tickets-table"
          hx-swap="innerHTML">
      <label class="grid gap-1 text-sm font-medium">
        Categoría
        <select name="category" class="rounded border border-slate-300 bg-white px-2 py-1.5 font-normal">
          <option value="">Todas</option>
          <option value="bug">bug</option>
          <option value="feature_request">feature_request</option>
          <option value="question">question</option>
          <option value="urgent">urgent</option>
        </select>
      </label>
      <label class="grid gap-1 text-sm font-medium">
        Prioridad
        <select name="priority" class="rounded border border-slate-300 bg-white px-2 py-1.5 font-normal">
          <option value="">Todas</option>
          <option value="P1">P1</option>
          <option value="P2">P2</option>
          <option value="P3">P3</option>
        </select>
      </label>
      <label class="grid gap-1 text-sm font-medium">
        Estado
        <select name="status" class="rounded border border-slate-300 bg-white px-2 py-1.5 font-normal">
          <option value="">Todos</option>
          <option value="open">open</option>
          <option value="in_progress">in_progress</option>
          <option value="closed">closed</option>
        </select>
      </label>
    </form>

    <div id="tickets-table" class="mt-4">
      {% include "_tickets_table.html" %}
    </div>
  </main>
</body>
</html>
