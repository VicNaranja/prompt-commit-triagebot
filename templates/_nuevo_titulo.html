<form method="post" action="/nuevo/titulo"
      hx-post="/nuevo/titulo" hx-target="#paso" hx-swap="innerHTML"
      class="space-y-8">
  <div class="space-y-3">
    <h1 class="text-3xl font-light tracking-tight sm:text-4xl">Le damos la bienvenida</h1>
    <p class="text-stone-500 dark:text-slate-400">Cuéntenos en pocas palabras qué ocurre.</p>
  </div>

  <div class="space-y-2">
    <label for="title" class="block text-sm font-medium text-stone-600 dark:text-slate-300">Título</label>
    <input id="title" name="title" type="text" maxlength="200" autofocus required
           value="{{ title }}"
           placeholder="Por ejemplo: la app no carga"
           class="w-full border-0 border-b border-stone-300 bg-transparent px-0 py-3 text-lg
                  placeholder:text-stone-300 focus:border-stone-900 focus:ring-0 focus:outline-none
                  dark:border-slate-700 dark:placeholder:text-slate-600 dark:focus:border-slate-100">
    {% if error %}
      <p class="text-sm text-red-600 dark:text-red-400" role="alert">{{ error }}</p>
    {% endif %}
  </div>

  <button type="submit"
          class="rounded-full bg-stone-900 px-8 py-3 text-sm font-medium text-white
                 transition hover:bg-stone-700 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-300">
    Siguiente
  </button>
</form>
